[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/

# 1. 啟動虛擬顯示器＋VNC Server（TigerVNC Xvnc，取代 Xvfb＋x11vnc）
# Xvfb 會讓 IB Gateway 登入畫面白底白字（2026-10-15 查證），Xvnc 正常
# 解析度、色深 24、DPI 100 與原本 Xvfb 相同（Xvfb 預設回報 100x100 DPI）
# -ac: 與原本 Xvfb 相同，不做 X 存取控制
# -rfbauth: 與原本 x11vnc 相同的 VNC 密碼認證（同樣只取前 8 字元）
# -AlwaysShared: 對應 x11vnc 的 -shared；Xvnc 本來就常駐，等同 -forever
[program:xvnc]
command=/bin/sh -c "echo \"$VNC_PASSWORD\" | /usr/bin/vncpasswd -f > /etc/vnc.pass && chmod 600 /etc/vnc.pass && exec /usr/bin/Xvnc %(ENV_DISPLAY)s -geometry %(ENV_RESOLUTION)s -depth 24 -dpi 100 -ac -SecurityTypes VncAuth -rfbauth /etc/vnc.pass -AlwaysShared -rfbport 5900"
autorestart=true
priority=10

# 2. 啟動視窗管理器 (Window Manager)
# 這是為了讓 App 有標題列、可以移動視窗
[program:openbox]
command=/bin/sh -c "sleep 2 && /usr/bin/openbox-session"
autorestart=true
priority=20

# 3. noVNC (這本身是 Web Server，依賴 VNC port，晚點啟動沒關係)
[program:novnc]
command=/bin/sh -c "sleep 4 && /usr/bin/websockify --web /usr/share/novnc 8080 localhost:5900"
autorestart=true
priority=40
